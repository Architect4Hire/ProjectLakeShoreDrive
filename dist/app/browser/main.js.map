<svg
  [attr.aria-hidden]="informative() ? null : 'true'"
  [attr.aria-label]="label()"
  [attr.role]="informative() ? 'img' : null"
  [class]="classes()"
  fill="none"
  focusable="false"
  viewBox="0 0 24 24"
  xmlns="http://www.w3.org/2000/svg">
  <path
    [attr.d]="path()"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2" />
</svg>
