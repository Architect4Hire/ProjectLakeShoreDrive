<div class="flex min-h-dvh bg-surface-page text-text-primary">
  <aside [attr.aria-label]="navigationLabel()" class="hidden shrink-0 lg:block">
    <ng-content select="[lsdShellNavigation]" />
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header>
      <ng-content select="[lsdShellHeader]" />
    </header>

    <main class="min-w-0 flex-1" tabindex="-1">
      <ng-content />
    </main>

    <footer>
      <ng-content select="[lsdShellFooter]" />
    </footer>
  </div>
</div>
